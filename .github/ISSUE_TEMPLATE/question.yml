name: Question
description: How to do something with Forja.
labels: [question]
body:
  - type: markdown
    attributes:
      value: The [documentation](https://github.com/forjadata/forja/tree/main/docs/en) may already answer it.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you tried.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forja version
      placeholder: 0.1.0
