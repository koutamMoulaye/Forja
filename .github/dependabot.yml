# Weekly updates, minor and patch versions grouped per ecosystem. Python uses the uv
# ecosystem (it updates uv.lock; the pip ecosystem would not), pnpm the npm one.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    commit-message: { prefix: build, include: scope }
    groups:
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    commit-message: { prefix: build, include: scope }
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: ci }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/docker]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: build, include: scope }
