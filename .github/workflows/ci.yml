name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Mocked LLM only: no provider is configured, no secret is needed, and the tests
      # against real providers are skipped.
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: OpenAPI document up to date
        run: uv run forja openapi --check

      - name: Tests
        run: uv run pytest -q -rf --junitxml=pytest-report.xml

      # Run logs need authentication; annotations are shown on the run page.
      - name: Report failed tests as annotations
        if: failure()
        run: uv run python .github/report_failures.py pytest-report.xml
