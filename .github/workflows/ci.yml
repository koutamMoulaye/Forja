name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Mocked LLM only: no real provider is ever called, no secret is needed.
      FORJA_LLM_PROVIDER: ""
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: OpenAPI document up to date
        run: uv run forja openapi --check

      - name: Tests
        run: uv run pytest -q -rf --junitxml=pytest-report.xml

      - name: Report failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("pytest-report.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for problem in [*case.iter("failure"), *case.iter("error")]:
                      text = (problem.get("message") or problem.text or "")[:900]
                      text = text.replace("%", "%25").replace("", "").replace("
", "%0A")
                      name = f"{case.get('classname')}.{case.get('name')}"
                      print(f"::error title={name}::{text}")
          PY
