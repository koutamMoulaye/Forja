name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Mocked LLM only: no provider is configured, no secret is needed, and the tests
      # against real providers are skipped.
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      # PostgreSQL and MySQL containers (docker/compose.test-db.yml) must start here.
      FORJA_TEST_DATABASES: require
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: OpenAPI document up to date
        run: uv run forja openapi --check

      - name: Tests
        run: uv run pytest -q -rf --junitxml=pytest-report.xml

      # Run logs need authentication; annotations are shown on the run page.
      - name: Report failed tests as annotations
        if: failure()
        run: uv run python .github/report_failures.py pytest-report.xml

  sqlserver:
    name: SQL Server connector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      FORJA_TEST_DATABASES: require
      # The SQL Server image is about 1.5 GB: tested in CI only.
      FORJA_TEST_SQLSERVER: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Database connectors, SQL Server included
        run: uv run pytest -q -rf tests/test_connectors_db.py

  volume:
    name: Volume, one million rows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      FORJA_VOLUME_ROWS: "1000000"
      FORJA_VOLUME_REPORT: volume-report.json
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ingestion, profile and Silver build of a generated file
        run: uv run pytest -q -s tests/test_volume.py

      - name: Measures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: volume-report
          path: volume-report.json
          if-no-files-found: ignore
          retention-days: 30

  web:
    name: Web, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript (strict)
        run: pnpm typecheck

      - name: Unit tests (API client up to date included)
        run: pnpm test

      - name: Build
        run: pnpm build

  web-e2e:
    name: Web, end-to-end against the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORJA_SKIP_REAL_LLM_TESTS: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the API
        working-directory: .
        run: uv sync --locked

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Chrome
        run: pnpm exec playwright install --with-deps chromium chrome

      - name: Playwright
        run: pnpm test:e2e

      - name: Captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14

  install:
    name: Install from scratch with docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the test client
        run: uv sync --locked

      - name: Build, first start with the demo, a question to the agent, clean-up
        run: uv run python scripts/test_install.py
