services:
  api:
    build: .
    image: forja-api:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORJA_DATA_DIR: /app/data
      FORJA_API_HOST: 0.0.0.0
      FORJA_API_PORT: "8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
