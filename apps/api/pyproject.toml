[project]
name = "forjadata-api"
version = "0.1.0"
description = "Forja HTTP API."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "forjadata-core",
    "forjadata-llm",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
forja-api = "forja_api.main:run"
forja = "forja_api.cli:main"

[tool.uv.sources]
forjadata-core = { workspace = true }
forjadata-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution forjadata-*, modules forja_* (the import names stay).
module-name = "forja_api"
