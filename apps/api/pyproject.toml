[project]
name = "forja-api"
version = "0.1.0"
description = "Forja HTTP API."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "forja-core",
    "forja-llm",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
forja-api = "forja_api.main:run"
forja = "forja_api.cli:main"

[tool.uv.sources]
forja-core = { workspace = true }
forja-llm = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"
