[project]
name = "forja"
version = "0.1.0"
description = "Automated, local-first data engineering platform: ingest, profile, model and deliver clean datasets."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "forja-core",
    "forja-llm",
    "forja-api",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "psutil>=6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/core", "packages/llm"]

[tool.uv.sources]
forja-core = { workspace = true }
forja-llm = { workspace = true }
forja-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "packages/core/src", "packages/llm/src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "RET", "PTH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["forja_core", "forja_llm", "forja_api", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "packages/core/src", "packages/llm/src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
markers = [
    "databases: needs the PostgreSQL and MySQL test containers (docker/compose.test-db.yml)",
    "volume: large generated file, run explicitly with FORJA_VOLUME_ROWS",
]
